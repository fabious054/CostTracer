# CostTracer — fixed price table (Scope 3, ADR 0003 decision D1)
#
# Embedded in the binary via include_str!. No AWS Price List API call — real-time pricing is
# backlog. All amounts are USD, AWS on-demand list price, for the 9 covered regions only.
#
# SOURCES (re-check these pages when you touch a number, and bump `captured`):
#   EBS volumes & snapshots : https://aws.amazon.com/ebs/pricing/
#   Elastic IP (idle)       : https://aws.amazon.com/vpc/pricing/    (Public IPv4 / idle EIP)
#
# HOW TO UPDATE
#   1. Open the pages above, switch to the region, copy the number.
#   2. Edit here; keep every region block complete (all EBS types keyed).
#   3. `cargo test -p cost-tracer pricing::` must stay green (shape + no zero/negative prices).
#   4. Note the change + date in docs/development.md is not required, but bump `captured` below.
#
# A region that is NOT in this file is reported as "price unavailable" — never approximated
# (ADR 0003). Add the region here to fix that.

[meta]
captured = "2026-08-30"
# AWS bills a "month" as 730 hours everywhere. Used to turn per-hour rates (Elastic IP) into
# the per-month reference figure the UI shows.
hours_per_month = 730

[fx]
# Fixed USD->BRL rate, refreshed by hand from time to time — never real-time (that's backlog,
# ADR 0003). The UI always shows USD and labels the BRL figure "approximate".
# Last set: 2026-08-30 (spot was ~5.16-5.19 BRL/USD across sources).
usd_brl = 5.18

# ---------------------------------------------------------------------------------------------
# EBS volumes — USD per GiB-month, by volume type, by region.
# io1/io2 also bill for provisioned IOPS and gp3 for provisioned throughput above baseline;
# the scan does not capture those, so those estimates are GiB-only (flagged in the UI).
# ---------------------------------------------------------------------------------------------

[ebs.us-east-1]
gp3 = 0.08
gp2 = 0.10
io1 = 0.125
io2 = 0.125
st1 = 0.045
