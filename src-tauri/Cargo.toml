[package]
name = "cost-tracer"
version = "0.4.0"
description = "Local-first AWS cost visibility tool"
authors = ["CostTracer contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "cost_tracer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# CancellationToken for the multi-region scan loop (ADR 0004 D1).
tokio-util = { version = "0.7", default-features = false }
dirs = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Scope 2 scan-history store (ADR 0002). `bundled` = SQLite compiled from source, no system dep.
rusqlite = { version = "0.32", features = ["bundled"] }
# Scope 3 fixed price table (ADR 0003 D1) — parsed once from an embedded TOML string.
toml = "0.8"

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"
aws-sdk-sts = "1"
aws-sdk-iam = "1"
aws-sdk-ec2 = "1"
aws-sdk-sso = "1"
aws-sdk-ssooidc = "1"

[features]
# This feature is used for production builds where `devUrl` is not needed.
custom-protocol = ["tauri/custom-protocol"]

# Only for the opt-in LocalStack harness in `tests/localstack.rs` (ADR 0003 D4). Not built by
# `cargo test` — run it with `cargo test --test localstack -- --ignored`.
[dev-dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
